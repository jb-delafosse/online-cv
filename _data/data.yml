experiences:
    title: Experiences
    info:
      - role: Staff Engineer — AI & Data
        time: 2025 - Present
        company: LumApps, Lyon
        details: |
          Back to hands-on engineering after five years of management; Staff Engineer since 2026.

          - Co-led the design and build of LumApps' agentic platform (custom agents, tools, MCP, multi-agent hand-off)
          - Pushed the adoption of the AG-UI protocol and its use to expose micro-apps as frontend tools for agents
          - Helped shape the agent evaluation approach (evaluation suites, Langfuse tracing)
          - Introduced spec-driven development with OpenSpec (specs, validation in CI, Jira sync)
          - Built Learning-to-Rank tooling for enterprise search (Elasticsearch LTR, judgment lists)
          - Kept contributing to the data platform (dbt, Looker, customer datalake)

          Python, GCP, BigQuery, dbt, Elasticsearch, Google ADK, LLMs
      - role: Engineering Manager — Data
        time: 2020 - 2025
        company: LumApps, Lyon
        details: |
          Managed the Data team (up to 10 people) and acted as its product owner (PSPO I).

          - Analytics dashboards, recommender systems and data pipelines for the product
          - Customer datalake offering and GDPR-compliant data deletion
          - Internal BI stack (Meltano, dbt, Looker)
      - role: Data Engineer
        time: 2018 - 2019
        company: LumApps, Lyon
        details: |
          Fast pace environment where I learned backend development and data engineering
          in a SaaS product. I was assigned to the Analytics Team in charge
          of providing analytics dashboards
            - Python (Flask)
            - Cloud Environment (GCP : Dataflow, BigQuery)
            - SQL (PostGreSQL & BigQuery)
      - role: Modelization Engineer
        time: 2013 - 2018
        company: Processium, Lyon
        details: |
          Modeling studies and machine learning in the Computer Science team.
          Designing methodologies to select a solvent, predicting
          chemical properties of chemicals and modeling phase equilibria
            - Python (scikit, theano, RDKit)
            - git
            - Aspen Plus
