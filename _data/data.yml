career-profile:
    title: Career Profile
    summary: |
      Staff Engineer at LumApps, co-leading the design of its AI agents platform.
      Previously managed the Data team for five years, building the product's analytics,
      recommendation and customer data features. Started in applied mathematics and
      machine learning for the chemical industry.
